<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect x="0" y="0" width="32" height="15" fill="#0f172a"/>
  <rect x="0" y="15" width="32" height="17" fill="#0369a1"/>
  <!-- Holographic Grid / Clouds -->
  <rect x="2" y="2" width="28" height="1" fill="#38bdf8" opacity="0.4"/>
  <rect x="4" y="5" width="24" height="1" fill="#38bdf8" opacity="0.4"/>
  <!-- Giant Futuristic Egg Dome (Fabrio-strata) -->
  <rect x="9" y="4" width="14" height="14" fill="#f8fafc"/>
  <rect x="11" y="2" width="10" height="2" fill="#f8fafc"/>
  <rect x="7" y="7" width="18" height="8" fill="#f8fafc"/>
  <!-- Crack / High-tech seam across the Egg -->
  <rect x="15" y="3" width="2" height="4" fill="#06b6d4"/>
  <rect x="14" y="7" width="3" height="3" fill="#06b6d4"/>
  <rect x="16" y="10" width="2" height="4" fill="#06b6d4"/>
  <!-- Punk Records antenna top -->
  <rect x="15" y="0" width="2" height="2" fill="#ef4444"/>
  <!-- Labophase cloud base ring -->
  <rect x="4" y="14" width="24" height="4" fill="#e0f2fe"/>
  <rect x="6" y="18" width="20" height="2" fill="#93c5fd"/>
  <!-- Metallic support pillars down to Fabriophase -->
  <rect x="8" y="20" width="3" height="8" fill="#475569"/>
  <rect x="21" y="20" width="3" height="8" fill="#475569"/>
  <rect x="14" y="20" width="4" height="8" fill="#334155"/>
  <!-- Ground Island / Ocean base -->
  <rect x="2" y="27" width="28" height="3" fill="#64748b"/>
</svg>
