<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Boundless Primordial Grandmist Void Background -->
  <rect x="0" y="0" width="32" height="32" fill="#2e1065"/>
  <rect x="0" y="10" width="32" height="12" fill="#581c87" opacity="0.4"/>
  <rect x="0" y="18" width="32" height="14" fill="#3b0764"/>
  <!-- Floating Primordial Grandmist Rock Island -->
  <polygon points="4,24 28,24 22,30 10,30" fill="#374151"/>
  <polygon points="4,24 28,24 26,26 6,26" fill="#4b5563"/>
  <!-- Rustic Thatched Straw Cottage / Hut -->
  <polygon points="16,8 7,16 25,16" fill="#b45309"/>
  <polygon points="16,10 9,16 23,16" fill="#d97706"/>
  <!-- Wooden Walls and Door -->
  <rect x="10" y="16" width="12" height="8" fill="#78350f"/>
  <rect x="14" y="18" width="4" height="6" fill="#451a03"/>
  <rect x="11" y="18" width="2" height="2" fill="#fef08a"/>
  <!-- Stone Table with Wine Flask outside -->
  <rect x="23" y="21" width="4" height="3" fill="#64748b"/>
  <rect x="24" y="19" width="2" height="2" fill="#dc2626"/>
</svg>
